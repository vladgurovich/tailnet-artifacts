# tailnet-artifacts with a Tailscale sidecar. Full guide: docs/platforms.md
#
#   cp .env.example .env    # then fill in TS_AUTHKEY, TS_HOSTNAME, ARTIFACTS_PUBLIC_URL, ARTIFACTS_OWNERS
#   docker compose up -d
#   docker compose exec artifacts node /app/bin/tailnet-artifacts.js token create my-laptop
#
# The artifacts container shares the sidecar's network namespace, so it listens on
# 127.0.0.1 and is only reachable through `tailscale serve` (HTTPS, tailnet-only).
#
# Tailscale runs in userspace networking mode: `tailscale serve` only needs inbound
# connections, so no /dev/net/tun device or NET_ADMIN capability is required, which
# lets the same file run on Synology and other NAS or rootless hosts.
services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: ${TS_HOSTNAME:-artifacts}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    restart: unless-stopped

  artifacts:
    image: ghcr.io/vladgurovich/tailnet-artifacts:${ARTIFACTS_VERSION:-latest}
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      ARTIFACTS_PUBLIC_URL: ${ARTIFACTS_PUBLIC_URL:?set ARTIFACTS_PUBLIC_URL in .env}
      ARTIFACTS_OWNERS: ${ARTIFACTS_OWNERS:-}
      ARTIFACTS_DEFAULT_TTL: ${ARTIFACTS_DEFAULT_TTL:-7d}
      ARTIFACTS_MAX_DATA_SIZE: ${ARTIFACTS_MAX_DATA_SIZE:-8GB}
    volumes:
      - artifacts-data:/data
    restart: unless-stopped

volumes:
  tailscale-state:
  artifacts-data:
